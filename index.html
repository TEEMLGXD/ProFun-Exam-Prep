<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProFun Exam Prep</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=JetBrains+Mono&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
    pre, code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header Controls -->
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">⚡ ProFun Exam Prep</h1>
        <p class="text-xs text-slate-400">คลังโจทย์ฝึกซ้อม & จำลองสอบปี 1</p>
      </div>
      <div class="flex gap-2">
        <button onclick="setMode('practice')" id="btn-practice" class="px-4 py-2 rounded-lg font-semibold text-sm transition bg-emerald-600 text-white">คลังโจทย์</button>
        <button onclick="setMode('exam')" id="btn-exam" class="px-4 py-2 rounded-lg font-semibold text-sm transition bg-slate-700 text-slate-300">จำลองสอบ</button>
      </div>
    </div>

    <!-- Main Content Container -->
    <div id="content" class="space-y-4"></div>

  </div>

  <!-- ดึงไฟล์ JavaScript แยก -->
  <script src="app.js"></script>
</body>
</html>
